[package]
name = "ifc_viewer"
version = "0.1.0"
edition = "2024"

[dependencies]
earcutr = "0.5.0"
epaint_default_fonts = "0.37.0"
eframe = { version = "0.37.0", default-features = false, features = ["glow", "default_fonts", "wayland", "x11"] }
glam = "0.34.1"
miniz_oxide = "0.8"
png = "0.18"
rayon = "1.12.0"
rfd = "0.17.2"
skrifa = "0.44.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
svg2pdf = { version = "0.13.0", default-features = false }
geo-straight-skeleton = "0.1.1"

# numéro de build de Windows (cadre de fenêtre : Windows 10 ou 11)
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_System_Registry"] }
