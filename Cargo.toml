[package]
name = "bimedit"
version = "0.1.0"
edition = "2024"
default-run = "bimedit"

[[bin]]
name = "bimedit"
path = "src/main.rs"

# serveur MCP (stdio) qui pilote le viewer par son canal local
[[bin]]
name = "bimedit-mcp"
path = "tools/viewer-mcp/serveur.rs"

[dependencies]
earcutr = "0.5.0"
epaint_default_fonts = "0.37.0"
eframe = { version = "0.37.0", default-features = false, features = ["wgpu", "default_fonts", "wayland", "x11"] }
glam = "0.34.1"
miniz_oxide = "0.8"
png = "0.18"
# textures des matériaux (onglet Apparence)
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg", "bmp", "tga", "tiff", "webp", "hdr", "exr"] }
rayon = "1.12.0"
rfd = "0.17.2"
skrifa = "0.44.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
serde_ignored = "0.1"
svg2pdf = { version = "0.13.0", default-features = false }
# assemblage des pages du PDF d'un jeu de feuilles (déjà utilisé par svg2pdf)
pdf-writer = "0.12.1"
geo-straight-skeleton = "0.1.1"
uuid = { version = "1.29.0", features = ["v4", "serde"] }
sha2 = "0.11.1"
yrs = { version = "0.28.0", features = ["sync"] }

# numéro de build de Windows (cadre de fenêtre : Windows 10 ou 11)
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_System_Registry", "Win32_System_ProcessStatus", "Win32_System_Threading", "Win32_Storage_FileSystem"] }

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"
