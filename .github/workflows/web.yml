name: Web

# Version navigateur (crates/web, ROADMAP §10.3) : construite par trunk sur master, publiée
# sur Cloudflare Pages si les secrets CLOUDFLARE_API_TOKEN et CLOUDFLARE_ACCOUNT_ID existent
# (projet Pages « bimedit »). Sinon, le site construit reste téléchargeable (artefact).
on:
  push:
    branches: [master]
    paths: ["crates/**", "Cargo.toml", "Cargo.lock", "gabarits/**", ".github/workflows/web.yml"]
  workflow_dispatch:

jobs:
  web:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          toolchain: stable
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - run: cargo install trunk --locked --version 0.22.2
      - name: Construction (trunk)
        working-directory: crates/web
        run: trunk build --release
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: bimedit-web
          path: crates/web/dist
      - name: Publication sur Cloudflare Pages
        if: env.CLOUDFLARE_API_TOKEN != '' && env.CLOUDFLARE_ACCOUNT_ID != ''
        run: npx --yes wrangler@4 pages deploy crates/web/dist --project-name=bimedit --branch=master
