name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  build:
    name: ${{ matrix.nom }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { nom: windows-x64, os: windows-latest, artefact: bimedit.exe }
          - { nom: windows-arm64, os: windows-11-arm, artefact: bimedit.exe }
          - { nom: linux-x64, os: ubuntu-latest, artefact: bimedit }
          - { nom: linux-arm64, os: ubuntu-24.04-arm, artefact: bimedit }
          - { nom: macos-arm64, os: macos-latest, artefact: bimedit }
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - name: Dépendances système (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libxkbcommon-dev libwayland-dev libx11-dev libxcb1-dev
      - run: cargo test --workspace --release
      - run: cargo build --release -p bimedit
      - name: Statistiques sur l'échantillon IFC
        run: cargo run --release -p bimedit -- --stats samples/test_ifc4.ifc
      - name: Livrables du projet natif autonome
        run: |
          cargo run --release -p bimedit -- --export-ifc samples/maison_native.bem target/maison.ifc
          cargo run --release -p bimedit -- --export-feuille samples/maison_native.bem A01 target/maison.pdf
          cargo run --release -p bimedit -- --quantites samples/maison_native.bem target/quantites.csv
      - name: Validation IFC indépendante (Linux x64)
        if: matrix.nom == 'linux-x64'
        run: |
          python3 -m pip install ifcopenshell==0.9.0.post1 pytest
          python3 tools/valider_ifc.py --donnees target/maison.ifc
          cargo run --release -p bimedit -- --modele samples/test_ifc4_proprietes.ifc target/proprietes.bem
          cargo run --release -p bimedit -- --export-ifc target/proprietes.bem target/proprietes.ifc
          python3 tools/valider_ifc.py --donnees target/proprietes.ifc
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: bimedit-${{ matrix.nom }}
          path: target/release/${{ matrix.artefact }}

  # Version navigateur (ROADMAP §10.3) : les crates déjà portées compilent pour wasm32
  wasm:
    name: compilation wasm32
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          toolchain: stable
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - run: >-
          cargo check --target wasm32-unknown-unknown
          -p noyau -p modele -p ifc_base -p scene -p formats -p maillage -p commandes
          -p moteur2d -p moteur3d -p echanges -p collaboration -p pilote -p config
      - run: cargo check --target wasm32-unknown-unknown -p interface --no-default-features
      - run: cargo check --target wasm32-unknown-unknown -p web
      - name: Interface sans la fonctionnalité poste (poste)
        run: |
          sudo apt-get update
          sudo apt-get install -y libxkbcommon-dev libwayland-dev libx11-dev libxcb1-dev
          cargo check -p interface --no-default-features --tests

  # Tests en mode debug : les assertions de débogage (debug_assert, débordements)
  # y sont actives, contrairement au mode release des autres tâches.
  debug:
    name: tests debug (linux-x64)
    runs-on: ubuntu-latest
    env:
      CARGO_PROFILE_DEV_DEBUG: 0
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          toolchain: stable
          components: clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - name: Dépendances système
        run: |
          sudo apt-get update
          sudo apt-get install -y libxkbcommon-dev libwayland-dev libx11-dev libxcb1-dev
      - run: cargo test --workspace
      # Essais d'interface par clics simulés (tools/test*.py) sur le binaire debug, sous
      # Xvfb : écran large pour les essais à deux instances côte à côte
      - name: Essais d'interface (Xvfb)
        run: |
          # winit charge ces bibliothèques à l'exécution (dlopen) sous X11
          sudo apt-get install -y xvfb mesa-vulkan-drivers libxkbcommon-x11-0 libx11-xcb1 libxcursor1 libxi6 libxrandr2
          cargo build -p bimedit
          xvfb-run -a -s "-screen 0 3200x1000x24" python3 tools/essais_interface.py --exe target/debug/bimedit
      # Bloquant (A1b, I5) : aucun avertissement ; `unwrap`, `expect` et `panic!` hors
      # tests interdits par `[workspace.lints]` (Cargo.toml) et `clippy.toml`
      - name: Clippy
        run: cargo clippy --workspace --tests -- -D warnings
