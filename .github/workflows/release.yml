name: Release

# Pousser une étiquette v* compile BIMedit pour les 5 cibles de la CI et publie une
# release GitHub avec les exécutables :
#   git tag v0.2.0
#   git push origin v0.2.0
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.nom }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - { nom: windows-x64, os: windows-latest }
          - { nom: windows-arm64, os: windows-11-arm }
          - { nom: linux-x64, os: ubuntu-latest }
          - { nom: linux-arm64, os: ubuntu-24.04-arm }
          - { nom: macos-arm64, os: macos-14 }
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - name: Dépendances système (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libxkbcommon-dev libwayland-dev libx11-dev libxcb1-dev
      - run: cargo build --release -p bimedit
      # Windows : l'exe seul ; Linux et macOS : archive, qui garde le droit d'exécution
      - name: Paquet
        shell: bash
        run: |
          mkdir paquet
          nom="bimedit-${GITHUB_REF_NAME}-${{ matrix.nom }}"
          if [ "$RUNNER_OS" = Windows ]; then
            cp target/release/bimedit.exe "paquet/$nom.exe"
          else
            tar -czf "paquet/$nom.tar.gz" -C target/release bimedit
          fi
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: paquet-${{ matrix.nom }}
          path: paquet/*

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          pattern: paquet-*
          path: paquets
          merge-multiple: true
      - name: Release GitHub
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" paquets/* --repo "$GITHUB_REPOSITORY" --title "$GITHUB_REF_NAME" --generate-notes
