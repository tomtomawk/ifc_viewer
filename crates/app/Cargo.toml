[package]
name = "bimedit"
version = "0.1.0"
edition = "2024"
default-run = "bimedit"

[[bin]]
name = "bimedit"
path = "src/main.rs"

[dependencies]
noyau = { path = "../noyau" }
modele = { path = "../modele" }
ifc_base = { path = "../ifc_base" }
formats = { path = "../formats" }
echanges = { path = "../echanges" }
collaboration = { path = "../collaboration" }
pilote = { path = "../pilote" }
config = { path = "../config" }
interface = { path = "../interface" }
glam.workspace = true

[target.'cfg(windows)'.build-dependencies]
winresource.workspace = true
